<svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
    <!-- 发光效果滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆角矩形 -->
  <rect x="10" y="10" width="280" height="80" rx="15" ry="15" fill="url(#bgGradient)" opacity="0.9"/>
  
  <!-- 装饰性几何图形 -->
  <circle cx="40" cy="35" r="8" fill="#ffffff" opacity="0.3"/>
  <circle cx="260" cy="65" r="6" fill="#ffffff" opacity="0.2"/>
  <polygon points="250,25 265,35 250,45" fill="#ffffff" opacity="0.25"/>
  
  <!-- 主标题 Huansky -->
  <text x="50" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" 
        fill="url(#textGradient)" filter="url(#glow)">Huansky</text>
  
  <!-- 副标题 FW -->
  <text x="50" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="normal" 
        fill="#ffffff" opacity="0.8" letter-spacing="2px">FRAMEWORK</text>
  
  <!-- 装饰线条 -->
  <line x1="50" y1="52" x2="220" y2="52" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  
  <!-- 版本标识 -->
  <circle cx="240" cy="40" r="12" fill="#ffffff" opacity="0.15"/>
  <text x="240" y="45" font-family="Arial, sans-serif" font-size="10" font-weight="bold" 
        fill="#ffffff" text-anchor="middle">v1</text>
</svg>
